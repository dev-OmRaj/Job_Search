[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "job-search-agent"
version = "0.1.0"
description = "Agentic job discovery and multi-resume matching for public company career pages"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "brotli>=1.1,<2",
  "httpx>=0.27,<1",
  "langchain-core>=1.0,<2",
  "langchain-ollama>=1.0,<2",
  "langgraph>=1.0,<2",
  "lxml>=5,<7",
  "numpy>=2,<3",
  "ollama>=0.6,<1",
  "playwright>=1.50,<2",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "PyYAML>=6,<7",
  "rich>=13,<15",
  "SQLAlchemy>=2,<3",
  "tenacity>=9,<10",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[project.scripts]
job-search = "job_search_agent.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Typer declares options in defaults. Broad catches are intentional at crawler,
# cloud, diagnostics, and workflow boundaries so partial scans remain useful.
ignore = ["B008", "BLE001", "ISC004", "TRY004"]
